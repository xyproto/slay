name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"
      - "**/*.png"
      - "**/*.svg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.log"
      - "**/*.png"
      - "**/*.svg"

jobs:
  # ── Ubuntu (gcc + clang, full example builds) ──────────────────────
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        go-version: ["1.25", "1.26"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install compiler and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libboost-all-dev \
            libconfig++-dev \
            libfcgi-dev \
            libglew-dev \
            libglfw3-dev \
            libglibmm-2.4-dev \
            libglm-dev \
            libglu1-mesa-dev \
            libgtk-4-dev \
            libopenal-dev \
            libpipewire-0.3-dev \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libsfml-dev \
            libvte-2.91-gtk4-dev \
            libvulkan-dev \
            libx11-dev \
            freeglut3-dev \
            qt6-base-dev \
            librtaudio-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang libomp-dev
          else
            sudo apt-get install -y g++
          fi

      - name: Build
        run: go build -v -buildvcs=false -o slay ./cmd/slay

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -failfast ./...

      - name: Smoke test (hello example)
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CXX=clang++
            export CC=clang
          fi
          ./slay -C examples/hello clean
          ./slay -C examples/hello build
          ./slay -C examples/hello test
          ./slay -C examples/hello clean

      - name: Build examples (best effort)
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CXX=clang++
            export CC=clang
          fi
          failed=""
          # Skip examples needing packages not in Ubuntu repos or with incompatible versions
          # SFML 3 is not yet in Ubuntu repos, so skip SFML-based examples
          # raylib and reactphysics3d are not in Ubuntu repos
          # rtaudio: Ubuntu 24.04 ships RtAudio 5, but the example requires RtAudio 6 API
          skip="bisqwit entities raylib raylib5 reactphysics rtaudio sfml sfml_audio win64crate gles3_sdl3 sdl3 glm box2d"
          for d in examples/*/; do
            name=$(basename "$d")
            echo "$skip" | grep -qw "$name" && { printf "=== %-30s SKIP\n" "$d"; continue; }
            printf "=== %-30s" "$d"
            if ./slay -C "$d" build > build.log 2>&1; then
              echo "OK"
            else
              echo "FAIL"
              cat build.log
              failed="$failed $d"
            fi
          done
          if [ -n "$failed" ]; then
            echo ""
            echo "Failed:$failed"
            exit 1
          fi

  # ── Arch Linux (Docker, full example builds) ───────────────────────
  archlinux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --security-opt seccomp=unconfined
    steps:
      - name: Install git
        run: pacman --disable-sandbox -Sy --noconfirm git
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          pacman --disable-sandbox -Sy --noconfirm archlinux-keyring
          pacman --disable-sandbox -Syu --noconfirm
          pacman --disable-sandbox -S --noconfirm --needed \
            base-devel go pkgconf \
            boost box2d fcgi freeglut glew glfw-x11 glibmm glm glu \
            gtk4 libconfig libpipewire libx11 openal qt6-base \
            raylib rtaudio sdl2 sdl2_mixer sdl3 sdl3_mixer \
            sfml vte4 vulkan-headers vulkan-icd-loader

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: go build -v -o slay ./cmd/slay

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -failfast ./...

      - name: Smoke test (hello example)
        run: |
          ./slay -C examples/hello clean
          ./slay -C examples/hello build
          ./slay -C examples/hello test
          ./slay -C examples/hello clean

      - name: Build examples
        run: |
          failed=""
          skip="win64crate reactphysics"
          for d in examples/*/; do
            name=$(basename "$d")
            echo "$skip" | grep -qw "$name" && { printf "=== %-30s SKIP\n" "$d"; continue; }
            printf "=== %-30s" "$d"
            if ./slay -C "$d" build > build.log 2>&1; then
              echo "OK"
            else
              echo "FAIL"
              cat build.log
              failed="$failed $d"
            fi
          done
          if [ -n "$failed" ]; then
            echo ""
            echo "Failed:$failed"
            exit 1
          fi

  # ── macOS ──────────────────────────────────────────────────────────
  macos:
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -v -buildvcs=false -o slay ./cmd/slay

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -failfast ./...

      - name: Smoke test (hello example)
        run: |
          ./slay -C examples/hello clean
          ./slay -C examples/hello build
          ./slay -C examples/hello test
          ./slay -C examples/hello clean
  # ── Windows (MSYS2 / UCRT64) ──────────────────────────────────────
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            git
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Build
        run: go build -v -buildvcs=false -o slay.exe ./cmd/slay

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -failfast ./...

      - name: Smoke test (hello example)
        run: |
          ./slay.exe -C examples/hello clean
          ./slay.exe -C examples/hello build
          ./slay.exe -C examples/hello test
          ./slay.exe -C examples/hello clean

  # ── FreeBSD ────────────────────────────────────────────────────────
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y go pkgconf
          run: |
            go build -v -buildvcs=false -o slay ./cmd/slay
            go vet ./...
            go test -v -count=1 -failfast ./...
            ./slay -C examples/hello clean
            ./slay -C examples/hello build
            ./slay -C examples/hello test
            ./slay -C examples/hello clean

  # ── OpenBSD ────────────────────────────────────────────────────────
  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/openbsd-vm@v1
        with:
          prepare: |
            pkg_add go gcc pkgconf
          run: |
            export CXX=eg++
            export CC=egcc
            go build -v -buildvcs=false -o slay ./cmd/slay
            go vet ./...
            go test -v -count=1 -failfast ./...
            ./slay -C examples/hello clean
            ./slay -C examples/hello build
            ./slay -C examples/hello test
            ./slay -C examples/hello clean

